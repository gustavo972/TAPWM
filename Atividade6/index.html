<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Triângulos</title>
    <meta name="description" content="Aplicação web para verificar a existência e a classificação de triângulos a partir de três lados.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Verificador de Triângulos</h1>
            <p>Insira os comprimentos de três lados para verificar se formam um triângulo e descobrir sua classificação.</p>
        </header>

        <main>
            <div class="input-group">
                <label for="sideA">Lado A:</label>
                <input type="number" id="sideA" placeholder="Insira o valor do lado A">
            </div>
            
            <div class="input-group">
                <label for="sideB">Lado B:</label>
                <input type="number" id="sideB" placeholder="Insira o valor do lado B">
            </div>
            
            <div class="input-group">
                <label for="sideC">Lado C:</label>
                <input type="number" id="sideC" placeholder="Insira o valor do lado C">
            </div>

            <button id="verifyButton">Verificar Triângulo</button>

            <div id="resultContainer" class="result-container hidden">
                <h2 id="resultTitle"></h2>
                <p id="resultMessage"></p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
