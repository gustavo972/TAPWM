<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 12 - Manipulação do DOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --gradient-closed: linear-gradient(135deg, #38bdf8, #818cf8);
      --glow-closed: 0 0 30px rgba(56, 189, 248, 0.25);
      --gradient-open: linear-gradient(135deg, #34d399, #059669);
      --glow-open: 0 0 30px rgba(52, 211, 153, 0.25);
      --gradient-broken: linear-gradient(135deg, #f87171, #dc2626);
      --glow-broken: 0 0 45px rgba(239, 68, 68, 0.45);
      --font-primary: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: var(--font-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 2rem;
    }

    .container {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2.5rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .header-tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 0.3rem 0.8rem;
      border-radius: 50px;
      background: rgba(148, 163, 184, 0.05);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--gradient-closed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .state-open h1 {
      background: var(--gradient-open);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .state-broken h1 {
      background: var(--gradient-broken);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: text-pulse 1.5s infinite;
    }

    .image-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      width: 100%;
      max-width: 480px;
      height: 320px;
      box-shadow: var(--glow-closed);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #020617;
    }

    .state-open .image-wrapper {
      box-shadow: var(--glow-open);
    }

    .state-broken .image-wrapper {
      box-shadow: var(--glow-broken);
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      border-color: rgba(239, 68, 68, 0.4);
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease;
    }

    body:not(.state-broken) img:hover {
      transform: scale(1.05);
    }

    .image-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.2) 0%, rgba(0, 0, 0, 0) 80%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .state-broken .image-wrapper::after {
      opacity: 1;
    }

    .info {
      font-size: 0.95rem;
      color: #64748b;
      margin-top: 0.5rem;
      line-height: 1.5;
    }

    .btn-reload {
      margin-top: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-family: var(--font-primary);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-reload:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    @keyframes text-pulse {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(239, 68, 68, 0)); }
      50% { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)); }
    }

    footer {
      margin-top: 2rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #475569;
    }
  </style>
</head>
<body id="body-context">

  <div class="container" id="container">
    <div class="header-tag">Atividade 12</div>
    <h1 id="titulo">Abra a Janela</h1>
    <div class="image-wrapper">
      <img id="janela" alt="Imagem interativa de uma janela">
    </div>

    <p class="info" id="instrucoes">
      Passe o mouse sobre a imagem para abrir. Retire para fechar.<br>
      <strong>Aviso:</strong> Evite clicar com força sobre o vidro da janela!
    </p>

    <button class="btn-reload" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Reiniciar Janela
    </button>
  </div>

  <footer>
    Desenvolvido por um Desenvolvedor Front-End Especialista
  </footer>

  <script>
    const urlClosed = "https://pngimg.com/uploads/window/window_PNG17705.png";
    const urlOpen = "https://pngimg.com/uploads/window/window_PNG17706.png";
    const urlBroken = "https://pngimg.com/uploads/broken_glass/broken_glass_PNG54.png";

    const imgElement = document.getElementById('janela');
    const titleElement = document.getElementById('titulo');
    const containerElement = document.getElementById('container');
    const bodyElement = document.getElementById('body-context');
    const instructionsElement = document.getElementById('instrucoes');

    let isBroken = false;

    imgElement.src = urlClosed;
    titleElement.innerText = "Abra a Janela";

    function handleMouseOver() {
      if (isBroken) return;
      imgElement.src = urlOpen;
      titleElement.innerText = "Janela aberta";
      containerElement.classList.add('state-open');
    }

    function handleMouseOut() {
      if (isBroken) return;
      imgElement.src = urlClosed;
      titleElement.innerText = "Janela Fechada";
      containerElement.classList.remove('state-open');
    }

    function handleClick() {
      if (isBroken) return;

      isBroken = true;
      imgElement.src = urlBroken;
      titleElement.innerText = "Janela Quebrada";

      containerElement.classList.remove('state-open');
      containerElement.classList.add('state-broken');
      bodyElement.classList.add('state-broken');

      instructionsElement.innerHTML = 'A janela foi quebrada! Os eventos de mouseover/mouseout foram desativados permanentemente.';

      imgElement.removeEventListener('mouseover', handleMouseOver);
      imgElement.removeEventListener('mouseout', handleMouseOut);


    }

    imgElement.addEventListener('mouseover', handleMouseOver);
    imgElement.addEventListener('mouseout', handleMouseOut);
    imgElement.addEventListener('click', handleClick);
  </script>
</body>
</html>
